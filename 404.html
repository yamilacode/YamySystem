<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Página no encontrada | YamySystem</title>

    <meta name="description" content="La página que buscas no existe o fue movida. Volvé al inicio de YamySystem, desarrollo web y software a medida.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#060811">
    <link rel="icon" href="img/logotipo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/css404.css?v=3">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.9/dist/lottie-player.js"></script>
</head>
<body class="body-404">

    <canvas id="bg-canvas-404" aria-hidden="true"></canvas>

    <main class="error-container-glass">
        <div class="error-cat-wrapper">
            <lottie-player src="json/WhiteCat.json" background="transparent" speed="1" loop autoplay></lottie-player>
        </div>

        <div class="error-code" data-text="404" aria-hidden="true">404</div>

        <h2>¿Te perdiste en el ciberespacio?</h2>
        <p class="error-message">
            El enlace que seguiste está roto o la página fue trasladada a otra coordenada del sistema.
        </p>

        <div class="error-actions">
            <a href="index.html" class="btn-404"><span><i class="fas fa-arrow-left"></i> Volver al Inicio</span></a>
            <a href="index.html#contacto" class="btn-404 secondary"><span><i class="fas fa-paper-plane"></i> Contacto</span></a>
        </div>

        <nav class="error-links" aria-label="Enlaces útiles">
            <a href="index.html">Inicio</a>
            <a href="index.html#servicios">Servicios</a>
            <a href="index.html#proyectos">Proyectos</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>
    </main>

    <script src="scripts/404.js?v=3"></script>
</body>
</html>
