<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA | Agencia de Fotografía Profesional</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020202; /* Fondo aún más oscuro para resaltar los colores */
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 15px;
            text-transform: uppercase;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.8);
        }

        p.subtitle {
            font-weight: 200;
            letter-spacing: 5px;
            margin-top: 10px;
            font-size: 1rem;
            color: #dddddd;
        }

        .scroll-indicator {
            text-align: center;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        .scroll-indicator p {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .scroll-line {
            width: 1px;
            height: 50px;
            background: linear-gradient(to bottom, #ffffff, transparent);
            margin: 0 auto;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        .btn-contact {
            position: absolute;
            top: 40px;
            right: 40px;
            padding: 12px 25px;
            border: 1px solid #ffffff;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        .btn-contact:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0px 0px 20px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <h1>Lumina</h1>
            <p class="subtitle">Colección de Fotografía Profesional</p>
        </header>
        
        <button class="btn-contact">Adquirir Licencias</button>

        <div class="scroll-indicator">
            <p>Haz Scroll para explorar</p>
            <div class="scroll-line"></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. CONFIGURACIÓN DE LA ESCENA
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020202, 0.025); // Niebla base oscura

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ==========================================
        // 2. CREACIÓN DEL EFECTO DE HUMO CON COLORES
        // ==========================================
        
        // Generador de textura de humo usando Canvas (Sin cargar imágenes externas)
        function createSmokeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Fondo negro (se vuelve transparente con Additive Blending)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 512, 512);

            // Crear un destello difuminado en el centro
            const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)'); // Centro blanco y semitransparente
            gradient.addColorStop(0.5, 'rgba(100, 100, 100, 0.1)'); // Borde suave
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Difuminado al negro total

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(256, 256, 256, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const smokeTexture = createSmokeTexture();
        const smokeGroup = new THREE.Group();
        scene.add(smokeGroup);

        // Paleta de colores espectaculares para el humo (Cian, Magenta, Púrpura, Azul)
        const smokeColors = [0x00ffff, 0xff00ff, 0x8a2be2, 0x0044ff, 0xff1493];
        const smokeParticles = [];

        // Distribuimos 80 paneles de humo a lo largo del túnel 3D
        for(let i = 0; i < 80; i++) {
            const color = smokeColors[Math.floor(Math.random() * smokeColors.length)];
            
            const smokeMaterial = new THREE.MeshBasicMaterial({
                color: color,
                map: smokeTexture,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending, // Esto hace el efecto de luz neón/humo brillante
                depthWrite: false // Evita que el humo tape mal las fotografías
            });

            // Tamaño aleatorio para cada nube de humo
            const size = Math.random() * 20 + 20; 
            const smokeGeometry = new THREE.PlaneGeometry(size, size);
            
            const smokePlane = new THREE.Mesh(smokeGeometry, smokeMaterial);
            
            // Posicionamos el humo por todo el recorrido
            smokePlane.position.set(
                (Math.random() - 0.5) * 40, // X: Izquierda / Derecha
                (Math.random() - 0.5) * 30, // Y: Arriba / Abajo
                (Math.random() * 10) - (i * 2.5) // Z: Distribuido a lo largo de todo el túnel
            );
            
            // Rotación inicial aleatoria
            smokePlane.rotation.z = Math.random() * Math.PI * 2;
            
            smokeGroup.add(smokePlane);
            smokeParticles.push(smokePlane);
        }

        // ==========================================
        // 3. CARGA DE IMÁGENES
        // ==========================================
        const imageUrls = [
            'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1515372039744-b04323eeb4a9?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1554080353-a576cf803bda?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1470071131384-001b85755536?q=80&w=1000&auto=format&fit=crop', 
            'https://images.unsplash.com/photo-1513364776144-60967b0f800f?q=80&w=1000&auto=format&fit=crop', 
            'https://www.pexels.com/es-es/foto/camara-sombrero-gorro-pina-5405652?q=80&w=1000&auto=format&fit=crop'
        ];

        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = "Anonymous";

        const planes = [];
        const gap = 12;

        const geometry = new THREE.PlaneGeometry(6, 8.5);

        imageUrls.forEach((url, index) => {
            textureLoader.load(url, (texture) => {
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.DoubleSide 
                });
                const plane = new THREE.Mesh(geometry, material);

                const isEven = index % 2 === 0;
                plane.position.x = isEven ? (Math.random() * 3 + 2.5) : -(Math.random() * 3 + 2.5);
                plane.position.y = (Math.random() - 0.5) * 5; 
                plane.position.z = - (index * gap);

                plane.rotation.y = isEven ? -0.15 : 0.15;

                scene.add(plane);
                
                planes.push({
                    mesh: plane,
                    initialY: plane.position.y,
                    randomPhase: Math.random() * Math.PI * 2
                });
            });
        });

        // ==========================================
        // 4. LÓGICA DE INTERACCIÓN Y SCROLL
        // ==========================================
        let targetScrollZ = 0;
        let currentScrollZ = 0;
        
        let mouseX = 0;
        let mouseY = 0;
        let targetCameraX = 0;
        let targetCameraY = 0;

        window.addEventListener('wheel', (event) => {
            targetScrollZ += event.deltaY * 0.05;
            const maxScroll = (imageUrls.length * gap) - 5;
            targetScrollZ = Math.max(0, Math.min(targetScrollZ, maxScroll));
        });

        let touchStartY = 0;
        window.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
        window.addEventListener('touchmove', e => {
            const deltaY = touchStartY - e.touches[0].clientY;
            targetScrollZ += deltaY * 0.1;
            const maxScroll = (imageUrls.length * gap) - 5;
            targetScrollZ = Math.max(0, Math.min(targetScrollZ, maxScroll));
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 5. ANIMACIÓN Y RENDERIZADO
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Movimiento fluido del scroll (Hacia adelante y atrás)
            currentScrollZ += (targetScrollZ - currentScrollZ) * 0.1;
            camera.position.z = 5 - currentScrollZ;

            // Movimiento Parallax de la cámara
            targetCameraX = mouseX * 2;
            targetCameraY = mouseY * 2;
            camera.position.x += (targetCameraX - camera.position.x) * 0.05;
            camera.position.y += (targetCameraY - camera.position.y) * 0.05;
            
            // Animación de las Fotografías (Flotación)
            planes.forEach(p => {
                p.mesh.position.y = p.initialY + Math.sin(elapsedTime + p.randomPhase) * 0.3;
            });

            // ANIMACIÓN DEL HUMO
            // 1. Rotación suave y constante
            smokeParticles.forEach(particle => {
                particle.rotation.z -= 0.002; 
            });

            // 2. Movimiento Izquierda-Derecha basado en el SCROLL
            // Usamos Math.sin para generar un movimiento de ola basado en qué tan profundo hemos escroleado
            smokeGroup.position.x = Math.sin(currentScrollZ * 0.1) * 8;
            // Opcional: También lo movemos un poquito en Y (arriba/abajo) para que sea más orgánico
            smokeGroup.position.y = Math.cos(currentScrollZ * 0.05) * 3;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
